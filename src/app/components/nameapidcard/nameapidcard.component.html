<div class="nameApiGrid">
  <div *ngFor="let nameApi of apiNames()" class="nameApiContainer">
    <div class="nameApiCard">
      <div class="example-card">
        <h1
          [routerLink]="['/dashboard/details']"
          [queryParams]="{ apiUrl: nameApi.apiUrl }"
        >
          {{ nameApi.name }}
        </h1>
      </div>
    </div>
  </div>
</div>
